report_comment: >
  This report has been generated by the <a href="https://github.com/nf-core/methylong/releases/tag/2.0.1" target="_blank">nf-core/methylong</a> analysis pipeline. For information about how to interpret these results, please see the <a href="https://nf-co.re/methylong/2.0.1/docs/output" target="_blank">documentation</a>.
report_section_order:
  "nf-core-methylong-methods-description":
    order: -1000
  software_versions:
    order: -1001
  "nf-core-methylong-summary":
    order: -1002

export_plots: true
# Kaleido static export is slow to start inside containers; the 30s default
# gave "0 of N plots exported" on Apptainer/Saga. A 2-sample run needed 253s,
# so leave generous headroom for larger cohorts.
export_plots_timeout: 1800

disable_version_detection: true
